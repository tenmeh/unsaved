<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 116" width="100" height="116">
  <!-- An ink form on cream, with a teal unsaved-changes dot.
       The inset hexagon and Poppins wordmark match the author's other packages.
       build-logo.R loads the local font in Chrome before making the PNG. -->
  <path d="M50 2 L98 30 L98 86 L50 114 L2 86 L2 30 Z" fill="#F4EFE4"
        stroke="#17202A" stroke-width="3" stroke-linejoin="round"/>
  <rect x="24" y="26" width="52" height="49" rx="6" fill="none"
        stroke="#17202A" stroke-width="3"/>
  <path d="M33 37 H52 M33 57 H49" stroke="#17202A" stroke-width="3"
        stroke-linecap="round"/>
  <rect x="33" y="43" width="34" height="8" rx="2" fill="#B9B2A3"/>
  <rect x="33" y="63" width="25" height="5" rx="2" fill="#B9B2A3"/>
  <circle cx="74" cy="28" r="9" fill="#237A80" stroke="#F4EFE4" stroke-width="3"/>
  <!-- "unsaved" is longer than "bones", so it is smaller and higher: at
       y = 96 the hexagon is only about 62 units wide. -->
  <text x="50" y="94" text-anchor="middle" font-size="13" font-weight="500"
        fill="#17202A" font-family="Poppins, sans-serif">unsaved</text>
</svg>
