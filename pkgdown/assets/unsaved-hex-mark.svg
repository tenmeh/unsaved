<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 116" width="100" height="116">
  <!--
    The hex of the logo without the wordmark, for the navigation bar, where
    it is drawn at about 30 pixels high. It is still, on purpose. The bar is
    on every page, and a picture that moves there would take the eye from
    the text. The paths and the colours are those of unsaved-hex.svg in
    pkgdown/logo/. The form and its dot are centred in the hex, and the
    border is one unit thicker, so that it holds at this size.
  -->
  <path d="M50 2 L98 30 L98 86 L50 114 L2 86 L2 30 Z" fill="#F4EFE4" stroke="#17202A" stroke-width="4" stroke-linejoin="round"/>
  <g transform="translate(50 60) scale(1.1) translate(-50 -50.5)">
    <rect x="24" y="26" width="52" height="49" rx="6" fill="none" stroke="#17202A" stroke-width="3"/>
    <path d="M33 37 H52 M33 57 H49" stroke="#17202A" stroke-width="3" stroke-linecap="round"/>
    <rect x="33" y="43" width="34" height="8" rx="2" fill="#B9B2A3"/>
    <rect x="33" y="63" width="25" height="5" rx="2" fill="#B9B2A3"/>
    <circle cx="74" cy="28" r="9" fill="#237A80" stroke="#F4EFE4" stroke-width="3"/>
  </g>
</svg>
